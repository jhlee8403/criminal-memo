name: Build Criminal Memo v1 auto-only test
on:
  push:
    branches:
      - experiment/v1-auto-latest-pdf
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install exact dependencies
        run: npm ci
        working-directory: windows
      - name: Build offline standalone HTML
        run: npm run build
        working-directory: windows
      - name: Basic HTML checks
        run: |
          test -s windows/distribution/CriminalMemo/CriminalMemo.html
          ! grep -q 'id="addPerson"' windows/distribution/CriminalMemo/CriminalMemo.html
          ! grep -q 'id="reviewed"' windows/distribution/CriminalMemo/CriminalMemo.html
          grep -q 'v1 자동 추출 시험판' windows/distribution/CriminalMemo/CriminalMemo.html
      - name: Upload Windows v1 auto-only distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CriminalMemo-v1-auto-only
          path: windows/distribution/CriminalMemo/
          if-no-files-found: error
          retention-days: 14
