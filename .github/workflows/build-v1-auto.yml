name: Build Criminal Memo batch case-number test
on:
  push:
    branches:
      - experiment/v1-batch-case-number
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install exact dependencies
        run: npm ci
        working-directory: windows
      - name: Parser regression tests
        run: npm test
        working-directory: windows
      - name: Build offline standalone HTML
        run: npm run build
        working-directory: windows
      - name: Verify Edge 104 compatibility in built HTML
        run: npm run test:built-compatibility
        working-directory: windows
      - name: Basic HTML checks
        run: |
          test -s windows/distribution/CriminalMemo/CriminalMemo.html
          ! grep -q 'id="addPerson"' windows/distribution/CriminalMemo/CriminalMemo.html
          ! grep -q 'id="reviewed"' windows/distribution/CriminalMemo/CriminalMemo.html
          grep -q 'v1 자동 추출 시험판' windows/distribution/CriminalMemo/CriminalMemo.html
      - name: Upload batch case-number trial distribution ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CriminalMemo-batch-case-number
          path: windows/distribution/CriminalMemo/
          if-no-files-found: error
          retention-days: 14
      - name: Download instructions
        run: |
          echo '### Windows 사건번호·일괄 생성 시험판' >> "$GITHUB_STEP_SUMMARY"
          echo '이 실행의 Artifacts에서 CriminalMemo-batch-case-number ZIP을 다운로드하고 압축을 푼 뒤 CriminalMemo.html을 여세요.' >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '최신 사용자 공소장 정확도 및 Windows Edge 실행은 별도 검증이 필요합니다.' >> "$GITHUB_STEP_SUMMARY"
