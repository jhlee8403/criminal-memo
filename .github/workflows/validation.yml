name: Validate Criminal Memo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core-and-coordinates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version && swift test --jobs 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-pdf.txt
      - run: python scripts/verify_pdfs.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pdf-coordinate-diagnostics
          path: artifacts/pdf-validation
  ipad-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Select available iPad simulator
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          ipad = next(d for group in devices['devices'].values() for d in group if 'iPad' in d['name'] and d.get('isAvailable'))
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('MEMO_SIMULATOR_ID=' + ipad['udid'] + '\n')
          PY
      - run: xcodebuild test -project CriminalMemo.xcodeproj -scheme CriminalMemo -destination "platform=iOS Simulator,id=$MEMO_SIMULATOR_ID" -resultBundlePath artifacts/AppleTests.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-test-results
          path: artifacts/AppleTests.xcresult
